services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_URL: ${CLIENT_URL:?set the public HTTPS origin in .env}
      TRUST_PROXY: true
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env before starting}
      DATABASE_URL: file:/data/signaldock.db
      AI_BASE_URL: ${AI_BASE_URL:-https://api.siliconflow.cn/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-Qwen/Qwen3-8B}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-12000}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-2}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-3}
      BRIEF_DAILY_LIMIT: ${BRIEF_DAILY_LIMIT:-30}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-300}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COLLECTION_SCHEDULE_ENABLED: ${COLLECTION_SCHEDULE_ENABLED:-false}
      COLLECTION_CRON: "${COLLECTION_CRON:-0 */2 * * *}"
      DIGEST_SCHEDULE_ENABLED: ${DIGEST_SCHEDULE_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    volumes:
      - signaldock-data:/data
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  signaldock-data:

